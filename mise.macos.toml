# macOS-only, loaded beside mise.toml by auto_env. It declares no
# [bootstrap.packages]: Homebrew owns every macOS package and the list is the
# Brewfile at the repo root (docs/adr/0011-homebrew-owns-macos-packages.md).

# ------------------------------------------------------------------- env --

[env]
# A Group Container path on macOS; the space is literal, not shell-escaped.
SSH_AUTH_SOCK = "{{env.HOME}}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"

# pnpm's own global bin dir (`pnpm add -g` shims), not the pnpm binary.
PNPM_HOME = "{{env.HOME}}/Library/pnpm"
_.path = ["{{env.HOME}}/Library/pnpm/bin"]

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
# Karabiner-Elements rewrites karabiner.json in place on every UI change, so
# `copy`, not a symlink that would dirty the repo.
"~/.config/karabiner/karabiner.json" = { mode = "copy" }

# ---------------------------------------------------------- macOS defaults --

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleShowAllExtensions = true }
"com.apple.dock" = { autohide = true }
"com.apple.finder" = { FXDefaultSearchScope = "SCcf", ShowStatusBar = true, FXEnableExtensionChangeWarning = false, WarnOnEmptyTrash = false }
"com.apple.driver.AppleBluetoothMultitouch.trackpad" = { Clicking = true }

[bootstrap.hooks]
# `defaults write` does not notify the running apps; they re-read on launch.
post-defaults = "killall Finder Dock 2>/dev/null || true"

# The macOS package phase in full — mise declares nothing for this OS. brew is
# put on PATH by bootstrap.sh's Preflight, which also installs it if missing.
pre-packages = 'brew bundle --file="$HOME/.dotfiles/Brewfile"'

# ------------------------------------------------------------ macOS extras --

[tasks."setup:macos"]
description = "macOS-only setup that has no declarative mise equivalent"
run = '''
set -u

# Global .NET tools live in ~/.dotnet/tools, outside any SDK, so mise does not
# track them and they must be installed separately.
if command -v dotnet >/dev/null 2>&1; then
  if dotnet tool list --global 2>/dev/null | grep -q '^ilspycmd'; then
    echo "  . ilspycmd"
  else
    dotnet tool install --global ilspycmd >/dev/null 2>&1 && echo "  + ilspycmd" \
      || echo "  ! ilspycmd install failed"
  fi
fi
'''

# The `dev:*` bodies live in mise.toml, which Windows also loads; this pulls
# them into the `setup:*` fan-out on the platforms that can run them.
[tasks."setup:dev"]
description = "Personal ~/dev checkouts: SSH remotes, agent + claude links, worktree CLI"
depends = ["dev:*"]
