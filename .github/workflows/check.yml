name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # dotfiles.root is a literal path ([settings] is not templated), so every
      # task hardcodes ~/.dotfiles and CI has to model the same layout.
      - name: Put the checkout where the config expects it
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      # Runners ship python3 and bash; zsh and shellcheck they do not.
      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck python3

      # install: false stops the *action* installing tools; --skip-tools below
      # is what stops `mise run` doing it. See docs/agents/verification.md.
      - uses: jdx/mise-action@v3
        with:
          install: false

      - run: mise trust --all

      - run: mise run --skip-tools check
