unbind r
bind r source ~/.config/tmux/tmux.conf

# Core settings

# Set prefix to Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

set -g extended-keys on
set -g extended-keys-format csi-u

# Kill pane instantly kithout the annoying confirmation prompt
bind x kill-pane

set-option -g renumber-windows on
set-option -g status-position top

# Force tmux to strictly respect manual window names globally
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Catppuccin Theme Configuration
set -g @catppuccin_window_status_style "rounded"

# The V2 fix: Force BOTH active and inactive windows to display the window name (#W)
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

set -g @catppuccin_status_modules_right "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Vim-style pane selection
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Industry standard ergonomic splitting
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Build the standard dev layout (ai on top, nvim|lazygit|terminal below)
bind D run-shell "~/.config/tmux/scripts/dev-layout.sh '#{pane_current_path}'"

# Re-balance the bottom row to equal thirds
bind = run-shell "~/.config/tmux/scripts/even-bottom.sh"

# Collapse the dev layout back to a single pane, keeping ai (vim :only)
bind o run-shell "~/.config/tmux/scripts/unwrap-layout.sh"

# Jump straight to a pane by its role (set by dev-layout.sh)
bind a run-shell "~/.config/tmux/scripts/jump-pane.sh ai"
bind e run-shell "~/.config/tmux/scripts/jump-pane.sh editor"
bind g run-shell "~/.config/tmux/scripts/jump-pane.sh git"
bind t run-shell "~/.config/tmux/scripts/jump-pane.sh terminal"

# Show each pane's role on its border
set -g pane-border-status top
set -g pane-border-format " #{?#{@role},#{@role},#{pane_index}} "

# Near-fullscreen popup (modal-style) with padding around the edges
# -E closes the popup when the shell exits; -w/-h as percentages keep a margin
bind p display-popup -E -w 95% -h 95% -d "#{pane_current_path}"

unbind '"'
unbind %

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
