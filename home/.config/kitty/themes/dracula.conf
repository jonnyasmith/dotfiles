# vim:ft=kitty

## name:    Dracula Custom
## license: MIT
## blurb:   Dracula with a slightly darker background, plus tab bar colours.

background #1e1f28
foreground #f8f8f2
cursor #bbbbbb
selection_background #44475a
selection_foreground #1e1f28

color0 #000000
color8 #545454
color1 #ff5555
color9 #ff5454
color2 #50fa7b
color10 #50fa7b
color3 #f0fa8b
color11 #f0fa8b
color4 #bd92f8
color12 #bd92f8
color5 #ff78c5
color13 #ff78c5
color6 #8ae9fc
color14 #8ae9fc
color7 #bbbbbb
color15 #ffffff

# Tab bar: Dracula purple marks the active tab, the muted selection grey the
# rest, against the darker Dracula chrome colour.
tab_bar_background #191a21
active_tab_background #bd92f8
active_tab_foreground #1e1f28
active_tab_font_style bold
inactive_tab_background #44475a
inactive_tab_foreground #f8f8f2
inactive_tab_font_style normal
