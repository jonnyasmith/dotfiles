# kitty expands ${KITTY_OS} itself (linux, macos or bsd), so the per-OS split
# needs no mise template. Both included files are tracked, so the include
# always resolves.

confirm_os_window_close 0

copy_on_select yes

enable_audio_bell no

font_size 14.0

tab_bar_style powerline
tab_powerline_style round
tab_activity_symbol *

include ${KITTY_OS}.conf
include dracula.conf
