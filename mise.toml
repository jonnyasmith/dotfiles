# ~/.dotfiles/mise.toml — the whole machine, declared once.
#
#   mise bootstrap            # converge this machine
#   mise bootstrap --dry-run  # show what would change, touch nothing
#   mise bootstrap status     # what is out of sync
#
# Also the *global* mise config: [dotfiles] links ~/.config/mise/config.toml
# back to this file. The [bootstrap.*] sections are inert outside an explicit
# `mise bootstrap`.

# Hard floor, not a warning: an older mise ignores the sections it does not
# know and "succeeds" with the whole per-OS half skipped. Capped by winget's
# jdx.mise, which bootstrap.ps1 installs from — see
# docs/adr/0005-mise-floor-is-what-winget-supplies.md.
min_version = "2026.7.15"

[settings]
# Absolute or ~/-prefixed. A relative value is written into the symlink target
# verbatim, dangles, and still reports "applied" (mise 2026.7.17).
dotfiles.root = "~/.dotfiles/home"

# Off by default in mise; without it the second entry in `node`/`python` below
# is unreachable. Scoped to those two so mise and uv agree on the interpreter
# uv writes into a project's .python-version.
idiomatic_version_file_enable_tools = ["node", "python"]

# Supply-chain quarantine on fuzzy resolution. `mise lock -g --bump` can move
# versions BACKWARDS under it; see
# docs/adr/0006-fuzzy-resolution-is-quarantined-for-seven-days.md.
minimum_release_age = "7d"

# ---------------------------------------------------------------- dotfiles --
#
# Mode selection: docs/agents/coding-standards.md. `{}` mirrors the
# home-relative target under dotfiles.root; an explicit `source` is relative to
# THIS file, hence the `home/` prefix.

[dotfiles]
# Ordering across these three is load-bearing —
# docs/adr/0007-mise-shims-lead-path-except-in-interactive-shells.md. Not
# [bootstrap.mise_shell_activate], which would inject its own `mise activate`
# block; mise defers to [dotfiles] when both target the same file.
"~/.zshrc" = {}
"~/.zshenv" = {}
"~/.zprofile" = {}
"~/.config/zsh/aliases.zsh" = {}
# Sourced by the `for config (~/.config/zsh/*.zsh)` loop in .zshrc.
"~/.config/zsh/os.zsh" = { source = "home/.config/zsh/os.zsh.tmpl", mode = "template" }

# config.local and config.work are deliberately absent: they hold the work org
# and email, are untracked, and are created per machine from
# config.local.example, which is itself never applied to $HOME. bootstrap.sh
# warns when they are missing.
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/git/config.os" = { source = "home/.config/git/config.os.tmpl", mode = "template" }

# The .pub stubs are deliberately NOT linked into ~/.ssh/1password — ~/.ssh/config
# names them by their in-repo path instead. Only `refresh`, which regenerates
# the stubs from the agent, is rendered into ~.
"~/.ssh/config" = { source = "home/.ssh/config.tmpl", mode = "template" }
"~/.ssh/1password/refresh" = { source = "home/.ssh/1password/refresh.tmpl", mode = "template" }
"~/.config/1Password/ssh/agent.toml" = {}

# nvim still writes spell/ and .netrwhist into its config dir, which is inside
# the repo — gitignored, deliberately.
"~/.config/nvim" = {}
"~/.config/tmux" = {}
"~/.config/ghostty/config" = {}
"~/.config/ghostty/os-local" = { source = "home/.config/ghostty/os-local.tmpl", mode = "template" }
"~/.config/starship.toml" = {}

# Tools that rewrite their own config on exit. copy, not symlink.
"~/.config/btop/btop.conf" = { mode = "copy" }
"~/.config/htop/htoprc" = { mode = "copy" }

# gh regenerates config.yml with defaults on *any* invocation if it is absent,
# so a symlink loses the race: mise deletes the target, gh recreates a stub,
# and the phase aborts with "refusing to overwrite existing files". hosts.yml
# holds the OAuth token and is deliberately unmanaged.
"~/.config/gh/config.yml" = { mode = "copy" }

# herdr writes session.json, .plugins.lock, logs and a socket beside its config
# and offers no way to relocate them, so name the single file we own.
"~/.config/herdr/config.toml" = {}

# One file out of a directory that is otherwise state: ~/.omp/agent also holds
# agent.db (the OAuth and API-key store), history.db, sessions/ and blobs/.
# `copy` because omp rewrites this file from `/settings` and onboarding.
"~/.omp/agent/config.yml" = { mode = "copy" }

# The three mise-owned AI CLIs whose update switch is a config key rather than
# an env var; see docs/adr/0004-one-updater-per-binary.md. `copy` because each
# is the file its own tool rewrites when a setting changes from inside the CLI.
"~/.codex/config.toml" = { mode = "copy" }
"~/.gemini/settings.json" = { mode = "copy" }
"~/.copilot/settings.json" = { mode = "copy" }

# This repo's mise config, as the *global* mise config — all five files, not
# just this one. Linking config.toml alone leaves the per-OS files as
# project-only, loaded solely while the shell is inside the repo. .miserc.toml
# has to come under its global name (`miserc.toml`, no dot): mise looks for the
# dotted name only in the cwd and its parents. Keep the files key-disjoint —
# precedence between them inverts by route (docs/agents/coding-standards.md).
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/mise/config.linux.toml" = "mise.linux.toml"
"~/.config/mise/config.macos.toml" = "mise.macos.toml"
"~/.config/mise/config.windows.toml" = "mise.windows.toml"
"~/.config/mise/miserc.toml" = ".miserc.toml"

# Without this link the lockfile lands in a real ~/.config/mise and never
# reaches the repo. Regenerate with `mise lock -g`.
"~/.config/mise/mise.lock" = "mise.lock"

# ------------------------------------------------------------------- repos --
#
# Cloned before dotfiles are applied. oh-my-zsh is cloned directly rather than
# run through its installer, whose only other jobs are chsh (now
# [bootstrap.user].login_shell) and writing a default .zshrc we link over.

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", ref = "master" }
# Keep in sync with the plugins=() list in home/.zshrc.
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "master" }
"~/.oh-my-zsh/custom/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git", ref = "master" }
# Deliberately NOT under ~/.config/tmux, which this repo links as one
# directory; tmux.conf exports TMUX_PLUGIN_MANAGER_PATH to match. Still needs
# `prefix + I` inside tmux once to fetch plugins.
"~/.local/share/tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm.git", ref = "master" }

# ------------------------------------------------------------------- tools --
#
# The selectors here are the *range*; mise.lock pins what is installed. Refresh
# it deliberately — `mise lock -g --bump` can roll versions back, and `-g` is
# required (docs/agents/coding-standards.md).

[tools]
# SDKs install side-by-side into one shared DOTNET_ROOT; the first entry is the
# default when no global.json applies.
dotnet = ["10", "8"]

# ~/.bun stays as BUN_INSTALL, bun's *global package* dir, so `bun install -g`
# bins keep working. mise owns only the binary.
bun = "1"

# First entry is the default `node`; the second stays installed so a project
# .nvmrc / .node-version can select it.
node = ["24", "22"]

# Majors, not `latest`. mise does not read package.json's `packageManager`.
pnpm = ["11", "10"]

# 3.13 is the default because it satisfies the most `requires-python` in ~/dev;
# several cap below 3.14. 3.12 stays for the projects pinned to it.
# Interpreters only — uv owns per-project venvs and `uv tool` installs.
python = ["3.13", "3.12"]

azure-cli = "latest"
bat = "latest"
# btop's aqua backend publishes Linux binaries only, and that failure takes the
# whole tools phase with it. macOS gets brew:btop in mise.macos.toml.
btop = { version = "latest", os = ["linux"] }
caddy = "latest"
claude = "latest"
# Zero shell invocations, deliberately kept: editors run it on save in every
# project carrying a .clang-format.
clang-format = "latest"
cmake = "latest"
codex = "latest"
# neofetch's replacement — upstream archived neofetch in 2024.
fastfetch = "latest"
fzf = "latest"
gh = "latest"
herdr = "latest"
jq = "latest"
just = "latest"
lazygit = "latest"
neovim = "latest"
ninja = "latest"
# Registry name is the repo (`oh-my-pi`); the binary is `omp`.
oh-my-pi = "latest"
ripgrep = "latest"
# The linter behind check:shell.
shellcheck = "latest"
starship = "latest"
terraform = "latest"
tmux = "latest"
# nvim's :checkhealth python3 provider. Linux takes it from its distro; brew
# has no formula and the registry no entry, so macOS goes through pipx. Scoped,
# or every Linux box would install it twice.
"pipx:pynvim" = { version = "latest", os = ["macos"] }
# usage-spec completion scripts shell out to this at completion time; without
# it, tab-completing `mise ` prints an error. Installed by home/.zshrc.
usage = "latest"
uv = "latest"
zoxide = "latest"
zig = "latest"

# The npm: backend keeps these outside any single node install, so upgrading
# node does not orphan them.
"npm:@github/copilot" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@ollama/pi-web-search" = "latest"
# Falls under aqua's weekly-download threshold, so it needs an explicit opt-in.
# Scoped to kb itself: its transitive dependencies stay supply-chain gated.
"npm:@dustinbyrne/kb" = { version = "latest", allow_low_downloads = true }
"npm:azure-functions-core-tools" = "latest"
"npm:ccstatusline" = "latest"
"npm:cline" = "latest"
"npm:firebase-tools" = "latest"
"npm:kanban" = "latest"

[env]
# `dotnet tool install --global` targets DOTNET_CLI_HOME (~/.dotnet), which is
# independent of DOTNET_ROOT. mise does not add it, so put it on PATH here.
_.path = ["~/.dotnet/tools"]

# The one mise-owned updater whose switch is an env var rather than a config
# key; see docs/adr/0004-one-updater-per-binary.md.
DISABLE_UPDATES = "1"

[settings.python]
# Activate a project's .venv on cd. uv creates the venv; mise just enters it.
uv_venv_auto = true

[settings.node]
# Install the corepack shims (yarn, yarnpkg) with every node version.
corepack = true

# ---------------------------------------------------------------- packages --
#
# The Linux lists live here, not in mise.linux.toml: the manager prefix already
# scopes them. macOS's brew list is in mise.macos.toml only because it is long.
# Placement and parity are enforced by check:packages (docs/adr/0003-*.md), and
# some entries need a third-party repo that [bootstrap.hooks.pre-packages] in
# mise.linux.toml adds first.

[bootstrap.packages]
# --- Debian / Ubuntu / Raspberry Pi / WSL ---
"apt:1password" = "latest"                # registry-skip: registry `1password` is the CLI, not the desktop app that serves the SSH agent. parity-skip: Arch takes it from the AUR in setup:arch
"apt:build-essential" = "latest"          # gcc/make/libc headers, matching Arch's base-devel and Fedora's @development-tools
"apt:ca-certificates" = "latest"          # Docker-repo prerequisite; also what makes HTTPS apt sources work
"apt:code" = "latest"                     # VS Code; needs the MS apt repo added in pre-packages. registry-skip: registry `code` is an unrelated coding CLI. parity-skip: Arch takes visual-studio-code-bin from the AUR
"apt:containerd.io" = "latest"            # parity-skip: Arch ships the whole engine as `docker`
"apt:curl" = "latest"
"apt:dbus-x11" = "latest"                 # dbus-launch, needed by gnome-tweaks over SSH/X
"apt:docker-buildx-plugin" = "latest"     # parity-skip: Arch ships the whole engine as `docker`
"apt:docker-ce" = "latest"                # engine; repo added in pre-packages. parity-skip: Arch ships the whole engine as `docker`
"apt:docker-ce-cli" = "latest"            # parity-skip: Arch ships the whole engine as `docker`
"apt:docker-compose-plugin" = "latest"    # `docker compose`. parity-skip: Arch ships this as `docker-compose`
"apt:git" = "latest"
"apt:google-chrome-stable" = "latest"     # repo added in pre-packages. parity-skip: Arch has no official Chrome; setup:arch takes google-chrome from the AUR
"apt:htop" = "latest"
"apt:nala" = "latest"                     # apt front-end used throughout docs/wsl.md
"apt:python3-pynvim" = "latest"           # the :checkhealth python3 provider. python3-neovim is a transitional dummy, absent from current Debian
"apt:socat" = "latest"                    # 1Password SSH-agent relay under WSL (docs/wsl.md section 6)
"apt:tree" = "latest"                     # registry-skip: registry `tree` is a Rust reimplementation with different flags
"apt:ubuntu-restricted-extras" = "latest" # blocks on the msttcorefonts EULA unless preseeded in pre-packages
"apt:unzip" = "latest"
"apt:vlc" = "latest"
"apt:wget" = "latest"
"apt:xz-utils" = "latest"
"apt:zip" = "latest"
"apt:zsh" = "latest"                      # pairs with [bootstrap.user].login_shell in mise.linux.toml
#
# ghostty is NOT declared here: its PPA builds for Ubuntu suites only, so on
# pure Debian or Raspberry Pi OS the package is unresolvable and every
# bootstrap reports a failure. setup:debian installs it behind the same
# `*ubuntu*` guard the PPA uses.

# --- Fedora ---
"dnf:1password" = "latest"             # repo imported in pre-packages. registry-skip: registry `1password` is the CLI, not the desktop app. parity-skip: Arch takes it from the AUR
"dnf:@development-tools" = "latest"    # toolchain group, matching apt's build-essential and Arch's base-devel
"dnf:code" = "latest"                  # VS Code; needs the MS yum repo added in pre-packages. registry-skip: registry `code` is an unrelated coding CLI. parity-skip: Arch takes visual-studio-code-bin from the AUR
"dnf:containerd.io" = "latest"         # parity-skip: Arch ships the whole engine as `docker`
"dnf:curl" = "latest"
"dnf:docker-buildx-plugin" = "latest"  # parity-skip: Arch ships the whole engine as `docker`
"dnf:docker-ce" = "latest"             # engine; repo added in pre-packages. parity-skip: Arch ships the whole engine as `docker`
"dnf:docker-ce-cli" = "latest"         # parity-skip: Arch ships the whole engine as `docker`
"dnf:docker-compose-plugin" = "latest" # `docker compose`. parity-skip: Arch ships this as `docker-compose`
"dnf:ghostty" = "latest"               # terminal; COPR repo enabled in pre-packages. parity-skip: Debian's PPA is Ubuntu-only, so setup:debian installs it there
"dnf:git" = "latest"
"dnf:google-chrome-stable" = "latest"  # repo added in pre-packages. parity-skip: Arch has no official Chrome; setup:arch takes google-chrome from the AUR
"dnf:htop" = "latest"
"dnf:python3-neovim" = "latest"        # the :checkhealth python3 provider; Fedora keeps the old source name
"dnf:tree" = "latest"                  # registry-skip: registry `tree` is a Rust reimplementation with different flags
"dnf:unzip" = "latest"
"dnf:vlc" = "latest"
"dnf:wget" = "latest"
"dnf:xz" = "latest"                    # parity-skip: Debian calls it xz-utils
"dnf:zip" = "latest"
"dnf:zsh" = "latest"                   # pairs with [bootstrap.user].login_shell

# --- Arch ---
# mise's pacman manager reads the official repos only; the AUR packages go
# through yay in [tasks."setup:arch"] instead.
"pacman:base-devel" = "latest"          # toolchain group; also a yay prerequisite
"pacman:bind" = "latest"                # dig/nslookup; Debian calls this dnsutils
"pacman:curl" = "latest"
"pacman:docker" = "latest"              # parity-skip: Debian and Fedora take the Docker CE package set instead
"pacman:docker-compose" = "latest"      # registry-skip: the registry ships a standalone binary, not the CLI plugin `docker compose` resolves. parity-skip: Debian and Fedora use docker-compose-plugin
"pacman:extension-manager" = "latest"   # GUI for GNOME extensions (Space Bar) - in extra, not the AUR
"pacman:ghostty" = "latest"             # terminal. parity-skip: Debian's PPA is Ubuntu-only, so setup:debian installs it there
"pacman:git" = "latest"
"pacman:htop" = "latest"                # the htoprc this repo links has to have the program it configures
"pacman:less" = "latest"
"pacman:linux-firmware-qcom" = "latest" # Qualcomm wifi firmware for the Dell XPS
"pacman:nano" = "latest"
"pacman:net-tools" = "latest"
"pacman:nvidia-open-lts" = "latest"     # LTS-kernel module; `nvidia-lts` is retired
"pacman:nvidia-settings" = "latest"
"pacman:nvidia-utils" = "latest"
"pacman:powertop" = "latest"            # pairs with the upower check in docs/arch.md
"pacman:python-pynvim" = "latest"       # the :checkhealth python3 provider
"pacman:rsync" = "latest"
"pacman:stress" = "latest"              # required by the `stress -c 4` verification in docs/arch.md
"pacman:tlp" = "latest"                 # enabled by setup:arch
"pacman:tlp-rdw" = "latest"
"pacman:tree" = "latest"                # registry-skip: registry `tree` is a Rust reimplementation with different flags
"pacman:unzip" = "latest"
"pacman:vlc" = "latest"
"pacman:wget" = "latest"
"pacman:xz" = "latest"                  # parity-skip: Debian calls it xz-utils
"pacman:zip" = "latest"
"pacman:zsh" = "latest"                 # pairs with [bootstrap.user].login_shell

# ------------------------------------------------------------------- tasks --
#
# The imperative rump — everything with no declarative mise section. There is
# exactly ONE [tasks.bootstrap] and it lives here; the `setup:*` fan-out is a
# glob so it matches only the tasks this platform loaded. Every setup:* task
# must be idempotent.

[tasks.bootstrap]
description = "Platform setup that has no declarative mise equivalent"
depends = ["setup:*"]
run = "echo 'bootstrap tasks complete'"

# VS Code extensions are deliberately NOT managed here — Settings Sync owns
# them. See docs/adr/0002-vscode-extensions-are-sync-owned.md.

# ------------------------------------------------------------------ checks --
#
# See docs/agents/verification.md. Unix-only: `shell = "bash -c"` because
# mise's default inline shell on Windows is `cmd /c`.

[tasks.check]
description = "Everything verifiable without touching the machine"
depends = ["check:*"]
run = "echo 'all checks passed'"

[tasks."check:tasks"]
description = "Static validation of every task definition"
shell = "bash -c"
run = '''
set -u
# MISE_CONFIG_ROOT is unset deliberately: a nested mise inherits it as $HOME,
# loads only config.toml, and the `setup:*` fan-out then reports "task not
# found" for tasks that live in a platform file.
cd "$HOME/.dotfiles" || { echo "  ! ~/.dotfiles is missing"; exit 1; }
env -u MISE_CONFIG_ROOT -u MISE_TASK_FILE mise tasks validate
'''

[tasks."check:shell"]
description = "Syntax-check every shell this repo runs: installed files and config bodies"
shell = "bash -c"
run = '''
set -u
cd "$HOME/.dotfiles" || { echo "  ! ~/.dotfiles is missing"; exit 1; }
bad=0

# os.zsh is checked from the live rendered copy, not the template: the template
# is not valid zsh until Tera has run.
for f in home/.zshrc home/.zshenv home/.zprofile home/.config/zsh/aliases.zsh "$HOME/.config/zsh/os.zsh"; do
  [ -f "$f" ] || continue
  zsh -n "$f" || { echo "  ! $f"; bad=1; }
done

bash -n bootstrap.sh || { echo "  ! bootstrap.sh"; bad=1; }

# Resolved once: it gates both the file pass below and the embedded pass.
have_sc=0
command -v shellcheck >/dev/null 2>&1 && have_sc=1
[ "$have_sc" -eq 1 ] || echo "  ! shellcheck missing — run 'mise install' (it is in [tools])"

if [ "$have_sc" -eq 1 ]; then
  shellcheck -S warning bootstrap.sh || bad=1
fi

# Every [bootstrap.hooks.*].run and [tasks.*].run in every mise*.toml, from any
# OS. Dialect follows what mise hands the body to; pwsh is counted as skipped.
command -v python3 >/dev/null 2>&1 || { echo "  ! python3 (3.11+) is required"; exit 1; }
bodies="$(mktemp -d)"
index="$(python3 - "$HOME/.dotfiles" "$bodies" <<'PY'
import pathlib, sys, tomllib

repo, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
for f in sorted(repo.glob("mise*.toml")):
    conf = tomllib.loads(f.read_text())
    entries = []
    for phase, hook in conf.get("bootstrap", {}).get("hooks", {}).items():
        entries.append((f"hooks.{phase}", hook, None))
    for name, task in conf.get("tasks", {}).items():
        shell = task.get("shell") if isinstance(task, dict) else None
        entries.append((f"tasks.{name}", task, shell))
    for label, entry, shell in entries:
        body = entry.get("run") if isinstance(entry, dict) else entry
        if not isinstance(body, str):
            continue
        label = f"{f.name}:{label}"
        stem = label.replace(".", "_").replace(":", "_").replace("/", "_")
        (out / stem).write_text(body)
        print(f"{stem}\t{(shell or 'sh').split()[0]}\t{label}")
PY
)"

n=0
skipped=0
while IFS=$'\t' read -r stem dialect label; do
  [ -n "$stem" ] || continue
  case "$dialect" in
    sh|bash) ;;
    *) skipped=$((skipped + 1)); continue ;;
  esac
  n=$((n + 1))
  "$dialect" -n "$bodies/$stem" || { echo "  ! $label"; bad=1; }
  if [ "$have_sc" -eq 1 ]; then
    sc="$(shellcheck -s "$dialect" -S warning "$bodies/$stem" 2>&1)" || {
      echo "  ! $label"
      echo "$sc" | sed "s|$bodies/$stem|$label|"
      bad=1
    }
  fi
done <<< "$index"
rm -rf "$bodies"

[ "$bad" -eq 0 ] && echo "  . shell files parse; $n embedded body(ies) checked, $skipped skipped"
exit "$bad"
'''

[tasks."check:config"]
description = "Parse every mise config and assert this repo's invariants"
shell = "bash -c"
run = '''
set -u
# Every mise.<os>.toml, including the ones this machine never loads. Stdlib
# only — CI runs this with --skip-tools, so python3 may be the system one.
command -v python3 >/dev/null 2>&1 || { echo "  ! python3 (3.11+) is required"; exit 1; }
python3 - "$HOME/.dotfiles" <<'PY'
import pathlib, sys, tomllib

repo = pathlib.Path(sys.argv[1])
bad = []
configs = {}

for name in [".miserc.toml", *sorted(p.name for p in repo.glob("mise*.toml"))]:
    f = repo / name
    if not f.exists():
        continue
    try:
        configs[name] = tomllib.loads(f.read_text())
    except tomllib.TOMLDecodeError as e:
        bad.append(f"{name}: {e}")

shared = configs.get("mise.toml", {})
dotfiles = shared.get("dotfiles", {})

root = shared.get("settings", {}).get("dotfiles", {}).get("root", "")
if not root.startswith(("~", "/")):
    bad.append(f"settings.dotfiles.root is relative: {root!r}")
root_dir = repo / "home" if root.endswith("/home") else repo

# Catches a rename in home/ that the manifest missed; otherwise a fresh machine
# is the first thing to notice.
for target, spec in dotfiles.items():
    if isinstance(spec, str):
        src = repo / spec
    elif spec.get("source"):
        src = repo / spec["source"]
    else:  # `{}` mirrors the home-relative target under dotfiles.root
        src = root_dir / target.removeprefix("~/")
    if not src.exists():
        bad.append(f"[dotfiles] {target}: source does not exist: {src.relative_to(repo)}")

# Exactly one [tasks.bootstrap]; a second one shadows the fan-out silently.
owners = [n for n, c in configs.items() if "bootstrap" in c.get("tasks", {})]
if owners != ["mise.toml"]:
    bad.append(f"[tasks.bootstrap] must be defined once, in mise.toml; found in {owners}")

# A platform config that is not linked is a project-only file, live only while
# the shell is inside the repo.
for name in configs:
    if name == "mise.toml":
        continue
    link = "~/.config/mise/" + ("miserc.toml" if name == ".miserc.toml"
                                else name.replace("mise.", "config.", 1))
    if dotfiles.get(link) != name:
        bad.append(f"{name} is not linked to {link} in [dotfiles]")

for b in bad:
    print(f"  ! {b}")
print(f"  ! {len(bad)} problem(s)" if bad else f"  . {len(configs)} config(s) valid")
sys.exit(1 if bad else 0)
PY
'''

[tasks."check:fmt"]
description = "Assert every mise config is formatted, including ones this OS never loads"
shell = "bash -c"
run = '''
set -u
# `mise fmt --check` only inspects the configs mise loaded, so it never sees
# the platform file for another OS — exactly the files that rot unwatched.
# `--stdin` needs no load, so compare each file against its own output.
command -v mise >/dev/null 2>&1 || { echo "  ! mise is required"; exit 1; }
cd "$HOME/.dotfiles" || { echo "  ! ~/.dotfiles is missing"; exit 1; }
# A string accumulator, not an array: bash's array-length syntax puts a brace
# immediately before a hash, which Tera reads as an unterminated comment open.
# `[tasks.*].run` is templated; this body cannot contain that pair.
bad=""
n=0
for f in .miserc.toml mise*.toml; do
  [ -f "$f" ] || continue
  n=$((n + 1))
  diff -q "$f" <(mise fmt --stdin < "$f" 2>/dev/null) >/dev/null 2>&1 || bad="$bad $f"
done
if [ -n "$bad" ]; then
  for b in $bad; do
    echo "  ! $b is not formatted"
  done
  echo "    fix each with: mise fmt --stdin < FILE > FILE.fmt && mv FILE.fmt FILE"
  exit 1
fi
echo "  . $n config(s) formatted"
'''

[tasks."check:packages"]
description = "Assert the registry rule and Linux package parity in [bootstrap.packages]"
shell = "bash -c"
run = '''
set -u
# Shells out to `mise search`; `mise registry` caps its output at 1000 rows.
command -v python3 >/dev/null 2>&1 || { echo "  ! python3 is required"; exit 1; }
command -v mise >/dev/null 2>&1 || { echo "  ! mise is required (registry lookup)"; exit 1; }
python3 - "$HOME/.dotfiles" <<'PY'
import os, pathlib, re, subprocess, sys

repo = pathlib.Path(sys.argv[1])
DISTRO = ("apt", "dnf", "pacman")
# brew-cask is out of scope for both halves; see docs/adr/0003-*.md.
ONPATH = DISTRO + ("brew",)

# A nested mise would inherit MISE_CONFIG_ROOT=$HOME from the task.
MISE_ENV = {k: v for k, v in os.environ.items() if k != "MISE_CONFIG_ROOT"}

# Parsed from the text rather than the TOML, because tomllib discards comments.
waived = {}
entries = []
for name in ("mise.toml", "mise.macos.toml"):
    for line in (repo / name).read_text().splitlines():
        m = re.match(r'"(\w[\w-]*):(@?[^"]+)"\s*=', line)
        if not m:
            continue
        mgr, pkg = m.groups()
        entries.append((mgr, pkg))
        comment = line.split("#", 1)[1] if "#" in line else ""
        waived[(mgr, pkg)] = {w for w in ("registry-skip", "parity-skip")
                              if w + ":" in comment}

bad = []

# --- registry rule -------------------------------------------------------
for mgr, pkg in entries:
    if mgr not in ONPATH:
        continue
    if "registry-skip" in waived[(mgr, pkg)]:
        continue
    hit = subprocess.run(["mise", "search", "-m", "equal", "--no-header", pkg],
                         capture_output=True, text=True, env=MISE_ENV)
    # `mise search` exits non-zero when nothing matches, which is the common
    # case. Anything else — a failed registry fetch, a mise too old for these
    # flags — must not read as "no match", or the registry half passes
    # vacuously.
    out = hit.stdout.strip()
    if hit.returncode != 0 and not re.search(r"not found in registry", hit.stderr):
        bad.append(f"{mgr}:{pkg}: registry lookup failed: "
                   f"{hit.stderr.strip().splitlines()[0] if hit.stderr.strip() else hit.returncode}")
    elif out:
        bad.append(f"{mgr}:{pkg} has an exact registry match "
                   f"({out.split()[0]}) — promote it to [tools] or add "
                   f"'# registry-skip: <reason>'")

# --- parity --------------------------------------------------------------
by_pkg = {}
for mgr, pkg in entries:
    if mgr in DISTRO:
        by_pkg.setdefault(pkg, set()).add(mgr)
for pkg, mgrs in sorted(by_pkg.items()):
    if len(mgrs) != 2:
        continue
    missing = ", ".join(sorted(set(DISTRO) - mgrs))
    if all("parity-skip" in waived[(m, pkg)] for m in mgrs):
        continue
    bad.append(f"{pkg} is declared for {', '.join(sorted(mgrs))} but not "
               f"{missing} — declare it there or add '# parity-skip: <reason>' "
               f"to every existing entry")

for b in bad:
    print(f"  ! {b}")
print(f"  ! {len(bad)} problem(s)" if bad
      else f"  . {len(entries)} package declaration(s) valid")
sys.exit(1 if bad else 0)
PY
'''

[tasks."check:comments"]
description = "Assert no comment block exceeds the budget in docs/adr/0009"
shell = "bash -c"
run = '''
set -u
# Stdlib python only; git enumerates the tracked files. See
# docs/adr/0009-comment-budget-is-a-static-check.md.
command -v python3 >/dev/null 2>&1 || { echo "  ! python3 is required"; exit 1; }
command -v git >/dev/null 2>&1 || { echo "  ! git is required"; exit 1; }
cd "$HOME/.dotfiles" || { echo "  ! ~/.dotfiles is missing"; exit 1; }
python3 - "$HOME/.dotfiles" <<'PY'
import pathlib, subprocess, sys

MAX = 9
WAIVER = "comment-budget-skip:"

# Filename or extension -> line-comment token. Anything absent is not measured;
# markdown is out of scope because `#` is a heading there and prose is what
# docs/ is for.
BY_NAME = {
    ".gitignore": "#", ".zprofile": "#", ".zshenv": "#", ".zshrc": "#",
    "config": "#", "config.local.example": "#", "htoprc": "#", "ignore": "#",
}
BY_EXT = {
    ".conf": "#", ".dconf": "#", ".lua": "--", ".ps1": "#", ".sh": "#",
    ".tmpl": "#", ".toml": "#", ".txt": "#", ".yaml": "#", ".yml": "#",
    ".zsh": "#",
}

# Vendored or tool-written, so not ours to measure. desktop/cosmic stays
# byte-comparable to its upstream (ADR 0008); the first thirty lines of
# agent.toml are 1Password's own generated header.
SKIP = (
    "desktop/cosmic/",
    "home/.config/1Password/ssh/agent.toml",
    "home/.config/btop/btop.conf",
    "home/.config/gh/config.yml",
    "home/.config/herdr/config.toml",
    "home/.config/htop/htoprc",
    "home/.config/nvim/",
)

repo = pathlib.Path(sys.argv[1])
bad = []
checked = 0
longest = 0

# Tracked files only. Read here rather than piped in, because the heredoc that
# carries this script is already this process's stdin.
listing = subprocess.run(["git", "ls-files"], cwd=repo, text=True,
                         capture_output=True)
if listing.returncode != 0:
    print("  ! git ls-files failed")
    sys.exit(1)

for rel in listing.stdout.splitlines():
    if not rel or rel.startswith(SKIP):
        continue
    name = pathlib.PurePosixPath(rel)
    token = BY_NAME.get(name.name) or BY_EXT.get(name.suffix)
    f = repo / rel
    if not token or not f.is_file():
        continue
    checked += 1
    # A sentinel blank line so a block running to EOF is still closed.
    lines = f.read_text(errors="replace").splitlines() + [""]
    run, start, waived = 0, 0, False
    for n, line in enumerate(lines, 1):
        text = line.strip()
        # A shebang is not a comment, and must not merge with the block under it.
        if text.startswith(token) and not (n == 1 and text.startswith("#!")):
            if run == 0:
                start, waived = n, WAIVER in text
            run += 1
            continue
        if run and not waived:
            longest = max(longest, run)
            if run > MAX:
                bad.append(f"{rel}:{start} comment block of {run} lines over "
                           f"the {MAX}-line budget — shorten it, move the "
                           f"durable part into docs/, or put "
                           f"'{WAIVER} <reason>' on its first line")
        run = 0

for b in bad:
    print(f"  ! {b}")
print(f"  ! {len(bad)} problem(s)" if bad
      else f"  . {checked} file(s) measured, longest block {longest} line(s)")
sys.exit(1 if bad else 0)
PY
'''

