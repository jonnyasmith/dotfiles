# Linux-only, loaded beside mise.toml by auto_env. It loads on EVERY Linux, so
# everything imperative here self-guards on a distro probe.

# ------------------------------------------------------------------- env --

[env]
# Under WSL nothing listens here until the npiperelay/socat bridge is running
# (docs/wsl.md); exporting it unconditionally is still correct.
SSH_AUTH_SOCK = "{{env.HOME}}/.1password/agent.sock"

# pnpm's own global bin dir, not the pnpm binary. The path is repeated rather
# than written as {{env.PNPM_HOME}}: a var is not visible to its own table.
PNPM_HOME = "{{env.HOME}}/.local/share/pnpm"
_.path = ["{{env.HOME}}/.local/share/pnpm/bin"]

[bootstrap.user]
# /usr/bin/zsh, not /bin/zsh: chsh validates against /etc/shells, and Fedora
# and Debian both list the /usr path there. Still prompts for the account
# password, and PAM only picks the change up at the next login.
login_shell = "/usr/bin/zsh"

# ------------------------------------------------------------ repo setup --
#
# Runs before [bootstrap.packages]: mise can install a package but cannot teach
# a package manager where to find it. Everything is guarded so a re-run is free.

[bootstrap.hooks.pre-packages]
run = '''
set -eu

# ---------------------------------------------------------------- Fedora ----
if command -v dnf >/dev/null 2>&1; then

  # `tee --append` is not idempotent — five bootstraps leave five copies of
  # each key — so test before appending.
  for kv in max_parallel_downloads=10 fastestmirror=true; do
    key=${kv%%=*}
    if ! grep -qE "^[[:space:]]*${key}[[:space:]]*=" /etc/dnf/dnf.conf; then
      echo "$kv" | sudo tee -a /etc/dnf/dnf.conf >/dev/null
    fi
  done

  # RPM Fusion (free). vlc is in Fedora's own repositories now, but the codecs
  # behind this are not.
  if ! rpm -q rpmfusion-free-release >/dev/null 2>&1; then
    sudo dnf install -y \
      "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
  fi

  if [ ! -f /etc/yum.repos.d/1password.repo ]; then
    sudo rpm --import https://downloads.1password.com/linux/keys/1password.asc
    sudo sh -c 'echo -e "[1password]\nname=1Password Stable Channel\nbaseurl=https://downloads.1password.com/linux/rpm/stable/\$basearch\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=\"https://downloads.1password.com/linux/keys/1password.asc\"" > /etc/yum.repos.d/1password.repo'
  fi

  # VS Code yum repo; dnf:code resolves only once this exists.
  if [ ! -f /etc/yum.repos.d/vscode.repo ]; then
    sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc
    printf '%s\n' \
      '[code]' \
      'name=Visual Studio Code' \
      'baseurl=https://packages.microsoft.com/yumrepos/vscode' \
      'enabled=1' \
      'autorefresh=1' \
      'type=rpm-md' \
      'gpgcheck=1' \
      'gpgkey=https://packages.microsoft.com/keys/microsoft.asc' \
      | sudo tee /etc/yum.repos.d/vscode.repo >/dev/null
  fi

  # Chrome is in no Fedora repository. The rpm's own postinst writes this exact
  # filename, so reusing it stops the machine ending up with two copies.
  if [ ! -f /etc/yum.repos.d/google-chrome.repo ]; then
    sudo rpm --import https://dl.google.com/linux/linux_signing_key.pub
    printf '%s\n' \
      '[google-chrome]' \
      'name=google-chrome' \
      'baseurl=https://dl.google.com/linux/chrome/rpm/stable/$basearch' \
      'enabled=1' \
      'gpgcheck=1' \
      'repo_gpgcheck=1' \
      'gpgkey=https://dl.google.com/linux/linux_signing_key.pub' \
      | sudo tee /etc/yum.repos.d/google-chrome.repo >/dev/null
  fi

  # Provides `copr` and `config-manager` for the two blocks below. Ensured out
  # here because each of those is guarded by a repo file an earlier run may
  # already have written, which would leave the other to fail under `set -e`.
  rpm -q dnf5-plugins >/dev/null 2>&1 || sudo dnf install -y dnf5-plugins

  # Ghostty is not in Fedora's repositories; scottames/ghostty is the COPR
  # ghostty.org points Fedora users at. `copr enable` writes the repo file
  # tested here; -y suppresses the "not part of Fedora" prompt.
  if [ ! -f /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo ]; then
    sudo dnf -y copr enable scottames/ghostty
  fi

  # Fedora's own moby-engine lags upstream and carries no compose plugin.
  if [ ! -f /etc/yum.repos.d/docker-ce.repo ]; then
    sudo dnf -y config-manager addrepo \
      --from-repofile=https://download.docker.com/linux/fedora/docker-ce.repo
  fi

  sudo dnf -q check-update || true
fi

# -------------------------------------------------------- Debian / Ubuntu ----
if command -v apt-get >/dev/null 2>&1; then
  # `if` rather than `&&`: this hook runs under `set -e`, and a machine with no
  # /etc/os-release must skip rather than abort.
  if [ -r /etc/os-release ]; then . /etc/os-release; fi

  # The key fetches below need curl and gpg, and a minimal Debian has neither.
  # A failed fetch here is unrepairable — see docs/agents/coding-standards.md.
  if ! command -v curl >/dev/null 2>&1 || ! command -v gpg >/dev/null 2>&1; then
    sudo apt-get update
    sudo apt-get install -y ca-certificates curl gnupg
  fi

  # Without this, apt:ubuntu-restricted-extras raises a debconf dialog and a
  # non-interactive bootstrap hangs on it indefinitely.
  if command -v debconf-set-selections >/dev/null 2>&1; then
    echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
      | sudo debconf-set-selections
  fi

  # apt, not snap: the snap build cannot use the SSH agent or system
  # authentication, which is the entire reason 1Password is on these machines.
  if [ ! -f /etc/apt/sources.list.d/1password.list ]; then
    curl -sS https://downloads.1password.com/linux/keys/1password.asc \
      | sudo gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
    echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main' \
      | sudo tee /etc/apt/sources.list.d/1password.list >/dev/null
    sudo mkdir -p /etc/debsig/policies/AC2D62742012EA22/
    curl -sS https://downloads.1password.com/linux/debian/debsig/1password.pol \
      | sudo tee /etc/debsig/policies/AC2D62742012EA22/1password.pol >/dev/null
    sudo mkdir -p /usr/share/debsig/keyrings/AC2D62742012EA22
    curl -sS https://downloads.1password.com/linux/keys/1password.asc \
      | sudo gpg --dearmor --output /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
  fi

  # Docker publishes repos for debian, ubuntu and raspbian only, so on a
  # derivative $ID (linuxmint, pop, zorin) is a name that 404s. $ID_LIKE decides.
  if [ ! -f /etc/apt/sources.list.d/docker.list ]; then
    case " ${ID:-} ${ID_LIKE:-} " in
      *" raspbian "*) docker_distro=raspbian ;;
      *" ubuntu "*)   docker_distro=ubuntu ;;
      *" debian "*)   docker_distro=debian ;;
      *)              docker_distro= ;;
    esac
    # VERSION_CODENAME is absent on Debian testing/unstable and on several
    # container images; UBUNTU_CODENAME is set on every Ubuntu derivative.
    docker_codename="${VERSION_CODENAME:-${UBUNTU_CODENAME:-}}"

    if [ -z "$docker_distro" ] || [ -z "$docker_codename" ]; then
      echo "  ! no Docker repo for ID=${ID:-unset} codename=${docker_codename:-unset}; skipping"
    else
      sudo install -m 0755 -d /etc/apt/keyrings
      # Dearmoured to a temp file and size-checked before anything reaches
      # /etc: docker.list is the idempotency guard, so an empty keyring written
      # beside it is unrepairable.
      docker_key="$(mktemp)"
      if curl -fsSL "https://download.docker.com/linux/${docker_distro}/gpg" \
           | gpg --dearmor > "$docker_key" && [ -s "$docker_key" ]; then
        sudo install -m 0644 "$docker_key" /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/${docker_distro} ${docker_codename} stable" \
          | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
      else
        echo "  ! could not fetch the Docker signing key; skipping the repo"
      fi
      rm -f "$docker_key"
    fi
  fi

  if [ ! -f /etc/apt/sources.list.d/vscode.sources ]; then
    sudo apt-get install -y wget gpg
    wget -qO- https://packages.microsoft.com/keys/microsoft.asc \
      | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
    printf '%s\n' \
      'Types: deb' \
      'URIs: https://packages.microsoft.com/repos/code' \
      'Suites: stable' \
      'Components: main' \
      'Architectures: amd64,arm64,armhf' \
      'Signed-By: /usr/share/keyrings/microsoft.gpg' \
      | sudo tee /etc/apt/sources.list.d/vscode.sources >/dev/null
  fi

  # Proprietary, so in no distribution repository. The deb's own postinst
  # writes this exact filename, so reusing the name avoids a duplicate source.
  if [ ! -f /etc/apt/sources.list.d/google-chrome.list ]; then
    chrome_key="$(mktemp)"
    if curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
         | gpg --dearmor > "$chrome_key" && [ -s "$chrome_key" ]; then
      sudo install -m 0644 "$chrome_key" /usr/share/keyrings/google-chrome.gpg
      echo 'deb [signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main' \
        | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
    else
      echo "  ! could not fetch the Google Chrome signing key; skipping the repo"
    fi
    rm -f "$chrome_key"
  fi

  # Guarded to the Ubuntu family, unlike the two repos above: Launchpad only
  # builds PPAs for Ubuntu suites, so on Debian or Raspberry Pi OS this would
  # add a suite that 404s and break every later `apt update`. The guard greps
  # the PPA URL, not a filename — add-apt-repository writes `.sources` on
  # 24.04+ and a `.list` on older releases.
  case "${ID:-}:${ID_LIKE:-}" in
    *ubuntu*)
      if ! grep -rqs 'ppa.launchpadcontent.net/mkasberg/ghostty-ubuntu' \
           /etc/apt/sources.list /etc/apt/sources.list.d/; then
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:mkasberg/ghostty-ubuntu
      fi
      ;;
  esac

  sudo apt-get update
fi
'''

# ------------------------------------------------------------------- tasks --
#
# Each must be idempotent (it runs on every bootstrap) and self-guarding (this
# file loads on all Linux). Task bodies ARE tera-templated, unlike hook bodies.

[tasks."setup:arch"]
description = "Arch: AUR packages, TLP/auto-cpufreq/fstrim, pacman colour, swappiness"
run = '''
command -v pacman >/dev/null 2>&1 || exit 0

# mise's pacman manager reads the official repos only; yay covers the AUR and
# is itself a manual prerequisite (docs/arch.md).
if command -v yay >/dev/null 2>&1; then
  # --needed makes this idempotent: already-current packages are skipped.
  yay -S --needed --noconfirm \
    auto-cpufreq \
    envycontrol \
    1password \
    google-chrome \
    visual-studio-code-bin
else
  echo "  ! yay not installed; see docs/arch.md. Skipping AUR packages." >&2
fi

# [bootstrap.linux.systemd.units] is deliberately not used: it *creates* unit
# files, and all of these ship their own. They only need enabling.
sudo systemctl enable --now tlp.service
sudo systemctl enable --now NetworkManager-dispatcher.service
# TLP owns radio-device state; systemd-rfkill fights it over wifi/bt blocks.
sudo systemctl mask systemd-rfkill.service systemd-rfkill.socket
# `auto-cpufreq --install` is not idempotent, so only run it if the unit is absent.
if command -v auto-cpufreq >/dev/null 2>&1 \
   && ! systemctl list-unit-files auto-cpufreq.service >/dev/null 2>&1; then
  sudo auto-cpufreq --install
fi
sudo systemctl enable --now fstrim.timer

# Naturally idempotent: once the line reads `Color`, the pattern stops matching.
sudo sed -i 's/^#Color$/Color/' /etc/pacman.conf

# Prioritise RAM over swap. Guarded so the file is written once, not appended to.
if ! grep -qs '^vm.swappiness=10$' /etc/sysctl.d/99-swappiness.conf; then
  echo 'vm.swappiness=10' | sudo tee /etc/sysctl.d/99-swappiness.conf
fi
'''

[tasks."setup:fedora"]
description = "Fedora post-bootstrap setup. No-op without dnf."
run = '''
command -v dnf >/dev/null 2>&1 || exit 0
echo "  . fedora setup complete"
'''

[tasks."setup:debian"]
description = "Debian/Ubuntu post-bootstrap setup. No-op without apt-get."
run = '''
set -u
command -v apt-get >/dev/null 2>&1 || exit 0

# ghostty is absent from [bootstrap.packages] because its PPA is Ubuntu-only,
# so the install sits behind the same guard pre-packages uses to add the PPA.
if [ -r /etc/os-release ]; then . /etc/os-release; fi
case "${ID:-}:${ID_LIKE:-}" in
  *ubuntu*)
    if command -v ghostty >/dev/null 2>&1; then
      echo "  . ghostty"
    elif sudo apt-get install -y ghostty; then
      echo "  + ghostty"
    else
      echo "  ! ghostty install failed"
    fi
    ;;
esac

echo "  . debian/ubuntu setup complete"
'''

[tasks."setup:docker"]
description = "Docker group membership and system service. No-op without docker."
run = '''
set -u
# The engine itself is declared in [bootstrap.packages]. What is left is
# imperative: [bootstrap.linux.systemd.units] writes *user* units, not system
# services or group membership.
command -v docker >/dev/null 2>&1 || { echo "  . docker not installed, skipped"; exit 0; }

# `id -un`, not $USER: this runs under `set -u` and USER is not exported by
# every context, which would abort the task — and a setup:* task may only exit 0.
me="$(id -un)"
if id -nG "$me" | tr ' ' '\n' | grep -qx docker; then
  echo "  . docker group"
elif sudo usermod -aG docker "$me"; then
  echo "  + docker group — log out and back in, or docker still needs sudo"
else
  echo "  ! could not add $me to the docker group"
fi

# WSL has no systemd unless it is enabled in /etc/wsl.conf, so probe for a live
# systemd rather than for systemctl, which exists either way.
if [ -d /run/systemd/system ]; then
  if systemctl is-enabled --quiet docker.service 2>/dev/null; then
    echo "  . docker.service"
  elif sudo systemctl enable --now docker.service; then
    echo "  + docker.service"
  else
    echo "  ! could not enable docker.service"
  fi
fi
'''

[tasks."setup:wsl"]
description = "WSL-only setup. No-op outside WSL."
run = '''
set -u
# os() is "linux" under WSL, so this is the only reliable probe.
if [ -z "${WSL_DISTRO_NAME:-}" ] && ! grep -qi microsoft /proc/version 2>/dev/null; then
  exit 0
fi

# Reported rather than written: `mise bootstrap` should not need sudo to edit a
# file outside $HOME, and a `tee` here would truncate any existing
# [automount]/[user] stanzas.
if ! grep -q '^command="service docker start"' /etc/wsl.conf 2>/dev/null; then
  echo "  ! /etc/wsl.conf is missing the docker boot stanza — see docs/wsl.md section 4"
fi

# Socket directory for the 1Password SSH-agent relay (docs/wsl.md section 6).
mkdir -p "$HOME/.1password"
echo "  . wsl setup complete"
'''

# --- Desktop axis -----------------------------------------------------------
#
# Siblings of setup:fedora/debian/arch, not dependencies: both desktops can be
# installed on one machine, and detection is on what is installed rather than
# on what is running. See README.md.

[tasks."setup:gtk"]
description = "GTK settings for any desktop. No-op without dconf."
shell = "bash -c"
run = '''
set -u
command -v dconf >/dev/null 2>&1 || exit 0

# Over SSH or from a tty the session bus is usually there but not in the
# environment; without it GIO silently falls back to the memory backend.
if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ] && [ -S "/run/user/$(id -u)/bus" ]; then
  DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
  export DBUS_SESSION_BUS_ADDRESS
fi

dconf load / < "$HOME/.dotfiles/desktop/gtk.dconf"
echo "  . gtk settings applied"
'''

[tasks."setup:gnome"]
description = "GNOME Shell settings. No-op where GNOME is not installed."
shell = "bash -c"
run = '''
set -u
if ! command -v gnome-shell >/dev/null 2>&1; then
  echo "  . gnome not installed, skipped"
  exit 0
fi

if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ] && [ -S "/run/user/$(id -u)/bus" ]; then
  DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
  export DBUS_SESSION_BUS_ADDRESS
fi

dconf load / < "$HOME/.dotfiles/desktop/gnome.dconf"

# Installed here rather than declared: package lists have an `os` dimension but
# no desktop one, and a GNOME-only GUI has no business on a COSMIC box.
if ! command -v gnome-tweaks >/dev/null 2>&1; then
  if command -v dnf >/dev/null 2>&1; then sudo dnf install -y gnome-tweaks
  elif command -v apt-get >/dev/null 2>&1; then sudo apt-get install -y gnome-tweaks
  elif command -v pacman >/dev/null 2>&1; then sudo pacman -S --needed --noconfirm gnome-tweaks
  fi
fi

echo "  . gnome settings applied"
'''

[tasks."setup:cosmic"]
description = "COSMIC settings. No-op where COSMIC is not installed."
shell = "bash -c"
run = '''
set -u
if ! command -v cosmic-comp >/dev/null 2>&1; then
  echo "  . cosmic not installed, skipped"
  exit 0
fi

src="$HOME/.dotfiles/desktop/cosmic"
dst="$HOME/.config/cosmic"

# Copy, not symlink: cosmic-config owns these at runtime and rewrites them on
# every GUI change. The repo is the seed; copy a change in Settings back.
n=0
while IFS= read -r rel; do
  out="$dst/$rel"
  mkdir -p "$(dirname "$out")"
  # @HOME@ keeps the Spawn() paths in the shortcut bindings machine-independent.
  tmp="$(mktemp)"
  sed "s|@HOME@|$HOME|g" "$src/$rel" > "$tmp"
  if cmp -s "$tmp" "$out"; then rm -f "$tmp"; else mv "$tmp" "$out"; n=$((n+1)); fi
done < <(cd "$src" && find . -type f -printf '%P\n')

if [ "$n" -gt 0 ]; then echo "  + cosmic: $n key(s) written"; else echo "  . cosmic settings current"; fi
'''

# Not part of bootstrap — `check:*` is outside the `setup:*` glob. Run it after
# editing desktop/*.dconf.
[tasks."check:dconf"]
description = "Verify desktop/*.dconf section paths against installed schemas"
shell = "bash -c"
run = '''
set -u
dir=/usr/share/glib-2.0/schemas
# The directory existing does NOT mean a desktop is installed — glib itself
# ships schemas into it. The per-file check below decides.
[ -d "$dir" ] || { echo "  . no glib schemas installed, skipped"; exit 0; }

# Reads the schema XML rather than GSettings: `gi` is not importable from the
# mise-managed python3 and PyGObject is a separate distro package.
python3 - "$dir" "$HOME/.dotfiles/desktop" <<'PY'
import pathlib, sys
import xml.etree.ElementTree as ET

schemas, keys = {}, {}
for x in pathlib.Path(sys.argv[1]).glob("*.gschema.xml"):
    try:
        root = ET.parse(x).getroot()
    except ET.ParseError:
        continue
    for s in root.iter("schema"):
        path = s.get("path")
        if not path:  # relocatable: no fixed path to check against
            continue
        p = path.strip("/")
        schemas[p] = s.get("id")
        keys[p] = {k.get("name") for k in s.iter("key")}

# Path prefixes some installed schema sits under.
installed_under = {p.rsplit("/", 1)[0] for p in schemas}

bad = 0
for f in sorted(pathlib.Path(sys.argv[2]).glob("*.dconf")):
    section, checked, skipped = None, 0, 0
    for n, line in enumerate(f.read_text().splitlines(), 1):
        line = line.strip()
        if not line or line.startswith("#"):
            continue
        if line.startswith("["):
            section = line[1:-1].strip("/")
            if section in schemas:
                checked += 1
            elif section.rsplit("/", 1)[0] not in installed_under:
                # Nothing from this component is installed at all, so there is
                # nothing to check the section against. This cannot catch a
                # typo in the parent prefix itself; one in the last component
                # still fails, because its siblings are installed.
                skipped += 1
                section = None
            else:
                print(f"  ! {f.name}:{n} no installed schema at /{section}/")
                bad += 1
                section = None
            continue
        key = line.split("=", 1)[0].strip()
        if section in keys and key not in keys[section]:
            print(f"  ! {f.name}:{n} {schemas[section]} has no key '{key}'")
            bad += 1
    if skipped:
        print(f"  . {f.name}: {checked} section(s) checked, "
              f"{skipped} not installed here")

print(f"  ! {bad} problem(s)" if bad else "  . dconf payloads valid")
sys.exit(1 if bad else 0)
PY
'''
