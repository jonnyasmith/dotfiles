# Linux-only configuration. Loaded automatically beside mise.toml because
# .miserc.toml sets `auto_env = true`; on macOS and Windows this file is not
# read at all. Merges with mise.toml rather than replacing it.
#
# IMPORTANT: this file loads on EVERY Linux — Arch, Fedora, Debian, Ubuntu,
# Raspberry Pi and WSL alike. There is no mise.arch.toml or mise.wsl.toml, and
# `os()` returns plain "linux" under WSL. So everything imperative in here must
# self-guard on something that identifies the distro (`command -v pacman`,
# `command -v dnf`, `command -v apt-get`, `grep -qi microsoft /proc/version`)
# and no-op cleanly everywhere else.
#
# The declarative package lists do NOT live here — they are in mise.toml, where
# the `apt:`/`dnf:`/`pacman:` manager prefix already scopes them correctly.

# ------------------------------------------------------------------- env --
#
# Environment that differs per OS. This lives here rather than as a Tera branch
# in home/.config/zsh/os.zsh.tmpl because the per-OS files are now linked into
# ~/.config/mise (see [dotfiles] in mise.toml), so this file is loaded from
# every directory rather than only inside the repo.
#
# What that buys over the rendered zsh: `mise x`, `mise en`, `mise run` and shim
# invocations all see these, not just interactive zsh, and the values stop
# needing shell quoting. What it does not change: a shell that never runs
# `mise activate` still does not get them, exactly as before — os.zsh was
# sourced from .zshrc only.

[env]
# 1Password SSH agent socket. Under WSL nothing listens on it until the
# npiperelay/socat bridge to the Windows agent is running (docs/wsl.md), but
# exporting it unconditionally is still correct: ssh fails identically with a
# missing socket and an unset variable, and the bridge creates the socket at
# this exact path once started.
SSH_AUTH_SOCK = "{{env.HOME}}/.1password/agent.sock"

# pnpm's own global bin dir (`pnpm add -g` installs shims here: wt, pn, pnpx).
# Distinct from the pnpm binary itself, which mise owns. The literal path is
# repeated rather than written as {{env.PNPM_HOME}} because env entries resolve
# in order and a var is not guaranteed visible to its own table.
PNPM_HOME = "{{env.HOME}}/.local/share/pnpm"
_.path = ["{{env.HOME}}/.local/share/pnpm/bin"]

[bootstrap.user]
# Every one of the old runbooks ended with "install zsh, then remember to chsh"
# and none of them did it. This is step 8 of `mise bootstrap`.
#
# /usr/bin/zsh, not /bin/zsh: chsh validates against /etc/shells, and Fedora and
# Debian/Ubuntu both list the /usr path there. `login_shell` is not templated,
# which is exactly why it is in a per-platform file.
#
# Still prompts for the account password, and PAM only picks the change up at
# the next login.
login_shell = "/usr/bin/zsh"

# ------------------------------------------------------------ repo setup --
#
# Runs before [bootstrap.packages]. Its whole job is adding the third-party
# repositories that some of those packages come from — mise can install a
# package but cannot teach a package manager where to find it.
#
# Hook `run` bodies are NOT tera-templated (handed straight to sh), so shell
# syntax here is unrestricted. Everything is guarded so re-running is free.

[bootstrap.hooks.pre-packages]
run = '''
set -eu

# ---------------------------------------------------------------- Fedora ----
if command -v dnf >/dev/null 2>&1; then

  # dnf tuning. The Fedora runbook used:
  #   echo "max_parallel_downloads=10" | sudo tee /etc/dnf/dnf.conf --append
  # which is NOT idempotent — `tee --append` re-appends on every run, so a box
  # bootstrapped five times ends up with five copies of each key. Test first.
  for kv in max_parallel_downloads=10 fastestmirror=true; do
    key=${kv%%=*}
    if ! grep -qE "^[[:space:]]*${key}[[:space:]]*=" /etc/dnf/dnf.conf; then
      echo "$kv" | sudo tee -a /etc/dnf/dnf.conf >/dev/null
    fi
  done

  # RPM Fusion (free). Not needed for vlc any more — Fedora ships vlc in its
  # own repositories now — but the codecs behind it still are, and enabling it
  # is idempotent and cheap.
  if ! rpm -q rpmfusion-free-release >/dev/null 2>&1; then
    sudo dnf install -y \
      "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
  fi

  # 1Password rpm repo, verbatim from the Fedora runbook.
  if [ ! -f /etc/yum.repos.d/1password.repo ]; then
    sudo rpm --import https://downloads.1password.com/linux/keys/1password.asc
    sudo sh -c 'echo -e "[1password]\nname=1Password Stable Channel\nbaseurl=https://downloads.1password.com/linux/rpm/stable/\$basearch\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=\"https://downloads.1password.com/linux/keys/1password.asc\"" > /etc/yum.repos.d/1password.repo'
  fi

  # VS Code yum repo. The old packages.sh listed `code` in its dnf array but
  # never added a repo, so it only ever worked on a machine where someone had
  # already done this by hand.
  if [ ! -f /etc/yum.repos.d/vscode.repo ]; then
    sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc
    echo -e "[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\nautorefresh=1\ntype=rpm-md\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc" \
      | sudo tee /etc/yum.repos.d/vscode.repo >/dev/null
  fi

  # Ghostty COPR. Ghostty is not in Fedora's own repositories — the project
  # ships official binaries for macOS only and leaves Linux to distro and
  # community packagers. scottames/ghostty is the COPR that ghostty.org itself
  # points Fedora users at. `copr enable` writes
  # /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo,
  # so testing for that file is the idempotency guard; -y suppresses the
  # "this repository is not part of Fedora" acknowledgement prompt.
  #
  # The copr subcommand lives in dnf5-plugins, which Fedora Workstation ships
  # but a minimal install does not.
  if [ ! -f /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo ]; then
    rpm -q dnf5-plugins >/dev/null 2>&1 || sudo dnf install -y dnf5-plugins
    sudo dnf -y copr enable scottames/ghostty
  fi

  # Docker CE. Fedora's own moby-engine lags upstream and carries no compose
  # plugin; download.docker.com is what Docker's install docs point Fedora at.
  if [ ! -f /etc/yum.repos.d/docker-ce.repo ]; then
    sudo dnf -y config-manager addrepo \
      --from-repofile=https://download.docker.com/linux/fedora/docker-ce.repo
  fi

  sudo dnf -q check-update || true
fi

# -------------------------------------------------------- Debian / Ubuntu ----
if command -v apt-get >/dev/null 2>&1; then
  # Sourced once for the whole branch: it names the Docker repo below and gates
  # the Ghostty PPA at the bottom. `if` rather than `&&` because this hook runs
  # under `set -e` and a machine without /etc/os-release must skip, not abort.
  if [ -r /etc/os-release ]; then . /etc/os-release; fi

  # Accept the Microsoft core fonts EULA up front. Without this,
  # apt:ubuntu-restricted-extras raises a debconf dialog and a non-interactive
  # bootstrap hangs on it indefinitely.
  if command -v debconf-set-selections >/dev/null 2>&1; then
    echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
      | sudo debconf-set-selections
  fi

  # 1Password apt repo, replacing `snap install 1password`. The snap build
  # cannot use the SSH agent or system authentication, and the SSH agent is the
  # entire reason 1Password is on these machines.
  if [ ! -f /etc/apt/sources.list.d/1password.list ]; then
    curl -sS https://downloads.1password.com/linux/keys/1password.asc \
      | sudo gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
    echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main' \
      | sudo tee /etc/apt/sources.list.d/1password.list >/dev/null
    sudo mkdir -p /etc/debsig/policies/AC2D62742012EA22/
    curl -sS https://downloads.1password.com/linux/debian/debsig/1password.pol \
      | sudo tee /etc/debsig/policies/AC2D62742012EA22/1password.pol >/dev/null
    sudo mkdir -p /usr/share/debsig/keyrings/AC2D62742012EA22
    curl -sS https://downloads.1password.com/linux/keys/1password.asc \
      | sudo gpg --dearmor --output /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
  fi

  # Docker CE. The distribution segment of these URLs is the ONLY thing that
  # differed between the Debian and Ubuntu runbooks, so the two collapse into
  # one branch — but it is NOT $ID. Docker publishes repos for debian, ubuntu
  # and raspbian only, and on a derivative (linuxmint, pop, zorin) $ID is a
  # name download.docker.com 404s on, so $ID_LIKE decides.
  if [ ! -f /etc/apt/sources.list.d/docker.list ]; then
    case " ${ID:-} ${ID_LIKE:-} " in
      *" raspbian "*) docker_distro=raspbian ;;
      *" ubuntu "*)   docker_distro=ubuntu ;;
      *" debian "*)   docker_distro=debian ;;
      *)              docker_distro= ;;
    esac
    # VERSION_CODENAME is absent on Debian testing/unstable and on several
    # container images; UBUNTU_CODENAME is set on every Ubuntu derivative.
    docker_codename="${VERSION_CODENAME:-${UBUNTU_CODENAME:-}}"

    if [ -z "$docker_distro" ] || [ -z "$docker_codename" ]; then
      echo "  ! no Docker repo for ID=${ID:-unset} codename=${docker_codename:-unset}; skipping"
    else
      sudo install -m 0755 -d /etc/apt/keyrings
      # Dearmoured to a temp file and size-checked before anything is written
      # to /etc. `set -e` only inspects the LAST command of a pipeline and
      # `gpg --dearmor` exits 0 on empty stdin, so a 404 would otherwise leave
      # an empty keyring plus a docker.list that breaks every subsequent
      # `apt-get update` — and docker.list is the idempotency guard, so no
      # re-run would ever repair it.
      docker_key="$(mktemp)"
      if curl -fsSL "https://download.docker.com/linux/${docker_distro}/gpg" \
           | gpg --dearmor > "$docker_key" && [ -s "$docker_key" ]; then
        sudo install -m 0644 "$docker_key" /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/${docker_distro} ${docker_codename} stable" \
          | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
      else
        echo "  ! could not fetch the Docker signing key; skipping the repo"
      fi
      rm -f "$docker_key"
    fi
  fi

  # VS Code apt repo (deb822), replacing `snap install --classic code`.
  if [ ! -f /etc/apt/sources.list.d/vscode.sources ]; then
    sudo apt-get install -y wget gpg
    wget -qO- https://packages.microsoft.com/keys/microsoft.asc \
      | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
    printf '%s\n' \
      'Types: deb' \
      'URIs: https://packages.microsoft.com/repos/code' \
      'Suites: stable' \
      'Components: main' \
      'Architectures: amd64,arm64,armhf' \
      'Signed-By: /usr/share/keyrings/microsoft.gpg' \
      | sudo tee /etc/apt/sources.list.d/vscode.sources >/dev/null
  fi

  # Ghostty PPA. Ghostty reached Ubuntu's own repositories in 26.04, but that
  # copy lags the upstream release; mkasberg/ghostty-ubuntu is the PPA
  # ghostty.org points Ubuntu users at and it covers 24.04 as well. Explicitly
  # NOT the `curl … | bash` installer from the same project — see docs/fedora.md
  # on why third-party install scripts are not piped into a shell here.
  #
  # Guarded to the Ubuntu family specifically, unlike the two repos above.
  # Launchpad only builds PPAs for Ubuntu suites, so on Debian or Raspberry Pi
  # OS add-apt-repository would add a suite that 404s and break `apt update`
  # for every subsequent run. That is why ghostty is not in
  # [bootstrap.packages] at all — setup:debian installs it behind this same
  # guard instead.
  #
  # The guard greps for the PPA's URL rather than a filename: add-apt-repository
  # writes `<owner>-ubuntu-<ppa>-<codename>.sources` on 24.04+ but a `.list` on
  # older releases, so the name is not stable across the versions this repo has
  # to work on. The URL is.
  case "${ID:-}:${ID_LIKE:-}" in
    *ubuntu*)
      if ! grep -rqs 'ppa.launchpadcontent.net/mkasberg/ghostty-ubuntu' \
           /etc/apt/sources.list /etc/apt/sources.list.d/; then
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:mkasberg/ghostty-ubuntu
      fi
      ;;
  esac

  sudo apt-get update
fi
'''

# ------------------------------------------------------------------- tasks --
#
# One task per platform, all reached by the single [tasks.bootstrap] in
# mise.toml via `depends = ["setup:*"]`. Each must be idempotent (it runs on
# every bootstrap) and self-guarding (this file loads on all Linux).
#
# Do NOT define [tasks.bootstrap] here: same-named tasks across merged configs
# replace each other silently, so it would shadow the shared one.
#
# Note task `run` bodies ARE tera-templated, unlike hook bodies — keep `{{` and
# `{%` out of them.

[tasks."setup:arch"]
description = "Arch: AUR packages, TLP/auto-cpufreq/fstrim, pacman colour, swappiness"
run = '''
command -v pacman >/dev/null 2>&1 || exit 0

# mise's pacman manager reads the official repos only, so the AUR packages go
# through yay. yay itself is a manual prerequisite — see docs/arch.md.
# neofetch is not here any more: upstream archived it in 2024 and fastfetch
# replaced it in [tools], where every OS gets the same version.
if command -v yay >/dev/null 2>&1; then
  # --needed makes this idempotent: already-current packages are skipped.
  yay -S --needed --noconfirm \
    auto-cpufreq \
    envycontrol \
    1password \
    visual-studio-code-bin
else
  echo "  ! yay not installed; see docs/arch.md. Skipping AUR packages." >&2
fi

# Power management. [bootstrap.linux.systemd.units] is deliberately NOT used
# here: that section *creates* unit files, and tlp/NetworkManager-dispatcher/
# fstrim/auto-cpufreq all ship their own. They only need enabling.
sudo systemctl enable --now tlp.service
sudo systemctl enable --now NetworkManager-dispatcher.service
# TLP owns radio-device state; systemd-rfkill fights it over wifi/bt blocks.
sudo systemctl mask systemd-rfkill.service systemd-rfkill.socket
# `auto-cpufreq --install` is not idempotent, so only run it if the unit is absent.
if command -v auto-cpufreq >/dev/null 2>&1 \
   && ! systemctl list-unit-files auto-cpufreq.service >/dev/null 2>&1; then
  sudo auto-cpufreq --install
fi
sudo systemctl enable --now fstrim.timer

# Uncomment `#Color` in pacman.conf. Naturally idempotent: once the line reads
# `Color`, the ^#Color$ pattern no longer matches.
sudo sed -i 's/^#Color$/Color/' /etc/pacman.conf

# Prioritise RAM over swap. Guarded so the file is written once, not appended to.
if ! grep -qs '^vm.swappiness=10$' /etc/sysctl.d/99-swappiness.conf; then
  echo 'vm.swappiness=10' | sudo tee /etc/sysctl.d/99-swappiness.conf
fi
'''

[tasks."setup:fedora"]
description = "Fedora post-bootstrap setup. No-op without dnf."
run = '''
command -v dnf >/dev/null 2>&1 || exit 0
echo "  . fedora setup complete"
'''

[tasks."setup:debian"]
description = "Debian/Ubuntu post-bootstrap setup. No-op without apt-get."
run = '''
set -u
command -v apt-get >/dev/null 2>&1 || exit 0

# ghostty is deliberately absent from [bootstrap.packages]: its PPA builds for
# Ubuntu suites only, so on pure Debian or Raspberry Pi OS apt:ghostty cannot
# resolve and reports a failure on every bootstrap. Package lists have a
# manager dimension but no distro-variant one, so the install sits behind the
# same guard pre-packages uses to add the PPA — the same reasoning that keeps
# gnome-tweaks in setup:gnome.
if [ -r /etc/os-release ]; then . /etc/os-release; fi
case "${ID:-}:${ID_LIKE:-}" in
  *ubuntu*)
    if command -v ghostty >/dev/null 2>&1; then
      echo "  . ghostty"
    elif sudo apt-get install -y ghostty; then
      echo "  + ghostty"
    else
      echo "  ! ghostty install failed"
    fi
    ;;
esac

echo "  . debian/ubuntu setup complete"
'''

[tasks."setup:docker"]
description = "Docker group membership and system service. No-op without docker."
run = '''
set -u
# The engine itself is declared in [bootstrap.packages] — docker-ce on
# Debian/Fedora, docker on Arch. What is left over is imperative because mise's
# declarative surface does not reach it: [bootstrap.user] configures the login
# shell only, and [bootstrap.linux.systemd.units] writes *user* units, not
# system services or group membership.
command -v docker >/dev/null 2>&1 || { echo "  . docker not installed, skipped"; exit 0; }

# `id -un`, not $USER: this body runs under `set -u` and USER is not exported
# by every context a task can be reached from, which would abort the task
# non-zero — and a setup:* task may only exit 0.
me="$(id -un)"
if id -nG "$me" | tr ' ' '\n' | grep -qx docker; then
  echo "  . docker group"
elif sudo usermod -aG docker "$me"; then
  echo "  + docker group — log out and back in, or docker still needs sudo"
else
  echo "  ! could not add $me to the docker group"
fi

# WSL has no systemd unless it is enabled in /etc/wsl.conf, so probe for a live
# systemd rather than for systemctl, which exists either way. setup:wsl reports
# the boot stanza that starts docker there instead.
if [ -d /run/systemd/system ]; then
  if systemctl is-enabled --quiet docker.service 2>/dev/null; then
    echo "  . docker.service"
  elif sudo systemctl enable --now docker.service; then
    echo "  + docker.service"
  else
    echo "  ! could not enable docker.service"
  fi
fi
'''

[tasks."setup:wsl"]
description = "WSL-only setup. No-op outside WSL."
run = '''
set -u
# There is no mise.wsl.toml and os() returns "linux" under WSL, so this is the
# only reliable probe.
if [ -z "${WSL_DISTRO_NAME:-}" ] && ! grep -qi microsoft /proc/version 2>/dev/null; then
  exit 0
fi

# /etc/wsl.conf: start docker at distro boot. WSL has no systemd by default, so
# setup:docker cannot enable the service and this stanza is what starts it.
# REPORTED rather than written — `mise bootstrap` should not need sudo to edit
# a file outside $HOME, and the original runbook's `tee` truncated the whole
# file, destroying any [automount]/[user] stanzas.
if ! grep -q '^command="service docker start"' /etc/wsl.conf 2>/dev/null; then
  echo "  ! /etc/wsl.conf is missing the docker boot stanza — see docs/wsl.md section 4"
fi

# Socket directory for the 1Password SSH-agent relay (docs/wsl.md section 6).
mkdir -p "$HOME/.1password"
echo "  . wsl setup complete"
'''

# --- Desktop axis -----------------------------------------------------------
#
# Distribution and desktop are independent: GNOME on Debian and Arch, GNOME or
# COSMIC on Fedora, and both installed side by side on the same machine. So the
# desktop tasks are siblings of setup:fedora/debian/arch, not dependencies of
# them, and each guards on the same kind of thing its distro counterpart does —
# is the software there.
#
# Detection is on what is INSTALLED, never on what is running.
# $XDG_CURRENT_DESKTOP only describes the session that happens to be live: it
# is unset over SSH and on a tty, and on a dual-desktop machine it would leave
# the other desktop unconfigured until you logged into it and re-bootstrapped.
# Configuring every desktop that is present is both idempotent and complete.
#
# `gsettings` is not a GNOME probe either. It ships with glib2, so it exists on
# any machine with GTK; `gnome-shell` is the thing that reads GNOME's keys.
#
# GNOME state is dconf, COSMIC state is RON files under ~/.config/cosmic, so
# each task applies a payload from desktop/ in the repo rather than carrying a
# wall of `gsettings set` lines. `dconf load` is idempotent, needs no installed
# schema, and merges — it writes the listed keys and touches nothing else.

[tasks."setup:gtk"]
description = "GTK settings for any desktop. No-op without dconf."
shell = "bash -c"
run = '''
set -u
command -v dconf >/dev/null 2>&1 || exit 0

# Over SSH or from a tty unit the session bus is usually still there but not in
# the environment; without it GIO silently falls back to the memory backend and
# the write is lost.
if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ] && [ -S "/run/user/$(id -u)/bus" ]; then
  export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
fi

dconf load / < "$HOME/.dotfiles/desktop/gtk.dconf"
echo "  . gtk settings applied"
'''

[tasks."setup:gnome"]
description = "GNOME Shell settings. No-op where GNOME is not installed."
shell = "bash -c"
run = '''
set -u
if ! command -v gnome-shell >/dev/null 2>&1; then
  echo "  . gnome not installed, skipped"
  exit 0
fi

if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ] && [ -S "/run/user/$(id -u)/bus" ]; then
  export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
fi

dconf load / < "$HOME/.dotfiles/desktop/gnome.dconf"

# gnome-tweaks exposes what this writes. It is installed here rather than
# declared in mise.toml because package lists have an `os` dimension but no
# desktop one, and a GNOME-only GUI has no business on a COSMIC or headless box.
if ! command -v gnome-tweaks >/dev/null 2>&1; then
  if command -v dnf >/dev/null 2>&1; then sudo dnf install -y gnome-tweaks
  elif command -v apt-get >/dev/null 2>&1; then sudo apt-get install -y gnome-tweaks
  elif command -v pacman >/dev/null 2>&1; then sudo pacman -S --needed --noconfirm gnome-tweaks
  fi
fi

echo "  . gnome settings applied"
'''

[tasks."setup:cosmic"]
description = "COSMIC settings. No-op where COSMIC is not installed."
shell = "bash -c"
run = '''
set -u
if ! command -v cosmic-comp >/dev/null 2>&1; then
  echo "  . cosmic not installed, skipped"
  exit 0
fi

src="$HOME/.dotfiles/desktop/cosmic"
dst="$HOME/.config/cosmic"

# Copy, not symlink: cosmic-config owns these files at runtime and rewrites them
# whenever a setting changes in the GUI, so a symlink would either be replaced
# behind our back or turn every GUI tweak into a dirty working tree. The repo is
# the seed for a new machine; to capture a change made in Settings, copy it back.
n=0
while IFS= read -r rel; do
  out="$dst/$rel"
  mkdir -p "$(dirname "$out")"
  # @HOME@ keeps the Spawn() paths in the shortcut bindings machine-independent.
  tmp="$(mktemp)"
  sed "s|@HOME@|$HOME|g" "$src/$rel" > "$tmp"
  if cmp -s "$tmp" "$out"; then rm -f "$tmp"; else mv "$tmp" "$out"; n=$((n+1)); fi
done < <(cd "$src" && find . -type f -printf '%P\n')

if [ "$n" -gt 0 ]; then echo "  + cosmic: $n key(s) written"; else echo "  . cosmic settings current"; fi
'''

# Not part of bootstrap — `check:*` is outside the `setup:*` glob. Run it after
# editing desktop/*.dconf, because `dconf load` accepts any path at all and a
# section header that does not match an installed schema's path is written to
# dconf and then read by nobody. That is the one way these payloads can rot
# silently; a wrong *value* is rejected by the schema at read time and a missing
# component (nautilus on a GNOME box without it) is reported, not failed.
[tasks."check:dconf"]
description = "Verify desktop/*.dconf section paths against installed schemas"
shell = "bash -c"
run = '''
set -u
dir=/usr/share/glib-2.0/schemas
[ -d "$dir" ] || { echo "  . no glib schemas installed, skipped"; exit 0; }

# Reads the schema XML rather than GSettings: `gi` is not importable from the
# mise-managed python3, and PyGObject is a separate distro package on Debian
# and Arch. The XML is always there — glib-compile-schemas needs it.
python3 - "$dir" "$HOME/.dotfiles/desktop" <<'PY'
import pathlib, sys
import xml.etree.ElementTree as ET

schemas, keys = {}, {}
for x in pathlib.Path(sys.argv[1]).glob("*.gschema.xml"):
    try:
        root = ET.parse(x).getroot()
    except ET.ParseError:
        continue
    for s in root.iter("schema"):
        path = s.get("path")
        if not path:  # relocatable: no fixed path to check against
            continue
        p = path.strip("/")
        schemas[p] = s.get("id")
        keys[p] = {k.get("name") for k in s.iter("key")}

bad = 0
for f in sorted(pathlib.Path(sys.argv[2]).glob("*.dconf")):
    section, optional = None, False
    for n, line in enumerate(f.read_text().splitlines(), 1):
        line = line.strip()
        if line.startswith("#"):
            # A `# optional` comment marks the next section as belonging to a
            # component that may not be installed (nautilus on a GNOME box that
            # uses another file manager). Without it an absent schema is a typo.
            optional = line.startswith("# optional")
            continue
        if not line:
            continue
        if line.startswith("["):
            section = line[1:-1].strip("/")
            if section not in schemas:
                if optional:
                    print(f"  . {f.name}: /{section}/ not installed, unchecked")
                else:
                    print(f"  ! {f.name}:{n} no installed schema at /{section}/")
                    bad += 1
            optional = False
            continue
        key = line.split("=", 1)[0].strip()
        if section in keys and key not in keys[section]:
            print(f"  ! {f.name}:{n} {schemas[section]} has no key '{key}'")
            bad += 1

print(f"  ! {bad} problem(s)" if bad else "  . dconf payloads valid")
sys.exit(1 if bad else 0)
PY
'''
